<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box1 {
            border-radius: 5px;
            border: 1px solid gray;

            width: 200px;

            display: flex;

            align-items: center;
            padding: 30px;
            margin-bottom: 10px;
            
        }

        #box2 {
            border-radius: 5px;
            border: 1px solid gray;

            width: 200px;

            display: flex;

            align-items: center;
            padding: 30px;
        }

        #result {
            margin: 10px;

        }

</head>

<body>

    <button onclick="click3()">메시지 선택</button>


    <script>
        function click1() {

            $box1.style.backgroundColor = "pink";
        }

            $box2.style.backgroundColor = "yellow";
        }

        }
    </script>

</body>

</html>
